<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daftar Freelancer - Sakerja Palopo</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .input-soft {
            @apply w-full px-5 py-3.5 rounded-2xl bg-white border border-gray-100 focus:outline-none focus:ring-2 focus:ring-pink-200 focus:border-pink-300 transition-all text-sm text-gray-700 shadow-sm;
        }
    </style>
</head>
<body class="bg-gray-50 antialiased">

    <header class="bg-white/80 backdrop-blur-md shadow-sm py-4 px-6 flex items-center fixed top-0 left-0 w-full z-20">
        <a href="index.html" class="mr-3 text-gray-400">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path></svg>
        </a>
        <h1 class="text-xl font-bold text-gray-700">Gabung <span class="text-pink-400">Sakerja</span></h1>
    </header>

    <main class="pt-24 pb-24 px-6 max-w-md mx-auto">
        <section class="mb-8 text-center">
            <div class="w-16 h-16 bg-pink-100 rounded-2xl flex items-center justify-center text-pink-500 mx-auto mb-4">
                <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z" stroke-width="2"></path></svg>
            </div>
            <h2 class="text-xl font-bold text-gray-800">Mulai Kerja Hari Ini</h2>
            <p class="text-gray-400 text-sm mt-1">Lengkapi data singkatmu untuk tampil di katalog jasa Sakerja Palopo.</p>
        </section>

        <form class="space-y-5">
            <div>
                <label class="block text-xs font-bold text-gray-500 uppercase tracking-wider mb-2 ml-1">Nama Lengkap</label>
                <input type="text" placeholder="Contoh: Andi Wijaya" class="w-full px-5 py-3.5 rounded-2xl bg-white border border-gray-100 focus:outline-none focus:ring-2 focus:ring-pink-200 transition-all text-sm shadow-sm">
            </div>

            <div>
                <label class="block text-xs font-bold text-gray-500 uppercase tracking-wider mb-2 ml-1">No. WhatsApp</label>
                <input type="tel" placeholder="08123456..." class="w-full px-5 py-3.5 rounded-2xl bg-white border border-gray-100 focus:outline-none focus:ring-2 focus:ring-pink-200 transition-all text-sm shadow-sm">
            </div>

            <div>
                <label class="block text-xs font-bold text-gray-500 uppercase tracking-wider mb-2 ml-1">Kategori Jasa Utama</label>
                <select class="w-full px-5 py-3.5 rounded-2xl bg-white border border-gray-100 focus:outline-none focus:ring-2 focus:ring-pink-200 transition-all text-sm shadow-sm appearance-none">
                    <option>Pilih Kategori...</option>
                    <option value="kurir">Kurir & Titip</option>
                    <option value="tukang">Tukang Serabutan</option>
                    <option value="kebersihan">Kebersihan Rumah</option>
                    <option value="ac">Servis AC</option>
                    <option value="guru">Guru Les Panggilan</option>
                    <option value="lainnya">Lainnya...</option>
                </select>
            </div>

            <div>
                <label class="block text-xs font-bold text-gray-500 uppercase tracking-wider mb-2 ml-1">Keahlian (Singkat)</label>
                <textarea rows="3" placeholder="Sebutkan apa saja yang bisa Anda kerjakan..." class="w-full px-5 py-3.5 rounded-2xl bg-white border border-gray-100 focus:outline-none focus:ring-2 focus:ring-pink-200 transition-all text-sm shadow-sm"></textarea>
            </div>

            <div class="pt-4">
                <button type="submit" class="w-full bg-pink-500 text-white font-bold py-4 rounded-2xl shadow-lg shadow-pink-200 hover:bg-pink-600 transition-all transform active:scale-95">
                    Daftar Sekarang
                </button>
                <p class="text-[10px] text-center text-gray-400 mt-4 px-4">
                    Dengan mendaftar, profil Anda akan terlihat oleh seluruh warga Palopo di aplikasi Sakerja.
                </p>
            </div>
        </form>
    </main>

    <nav class="bg-white border-t border-gray-100 py-3 px-8 flex justify-between items-center fixed bottom-0 left-0 w-full z-20">
        <a href="index.html" class="flex flex-col items-center text-gray-400">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6" stroke-width="2"></path></svg>
            <span class="text-[10px] font-medium mt-1 text-gray-400">Beranda</span>
        </a>
        <a href="tugas.html" class="flex flex-col items-center text-gray-400">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2" stroke-width="2"></path></svg>
            <span class="text-[10px] font-medium mt-1">Tugas</span>
        </a>
        <a href="daftar-freelancer.html" class="flex flex-col items-center text-pink-500">
            <div class="w-12 h-12 bg-pink-500 rounded-full flex items-center justify-center text-white shadow-lg -mt-8 border-4 border-white">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M12 4v16m8-8H4" stroke-width="2.5"></path></svg>
            </div>
            <span class="text-[10px] font-bold mt-1">Daftar</span>
        </a>
        <a href="pesan.html" class="flex flex-col items-center text-gray-400">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M8 10h.01M12 10h.01M16 10h.01M9 16H5a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v8a2 2 0 01-2 2h-5l-5 5v-5z" stroke-width="2"></path></svg>
            <span class="text-[10px] font-medium mt-1">Pesan</span>
        </a>
        <a href="profil.html" class="flex flex-col items-center text-gray-400">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" stroke-width="2"></path></svg>
            <span class="text-[10px] font-medium mt-1">Profil</span>
        </a>
    </nav>

</body>
</html>
