<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profil Saya - Sakerja Palopo</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .bg-soft-gradient {
            background: linear-gradient(135deg, #FF9A9E 0%, #FAD0C4 100%);
        }
    </style>
</head>
<body class="bg-gray-50 antialiased">

    <header class="bg-soft-gradient pt-16 pb-16 px-6 rounded-b-[40px] shadow-lg">
        <div class="flex flex-col items-center">
            <div class="relative">
                <img src="https://ui-avatars.com/api/?name=User+Palopo&background=white&color=FF6B6B&size=128" alt="Foto Profil" class="w-28 h-28 rounded-3xl border-4 border-white shadow-xl object-cover">
                <button class="absolute -bottom-2 -right-2 bg-white p-2.5 rounded-2xl shadow-md text-pink-500 hover:bg-pink-50 transition-colors">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z" stroke-width="2"></path></svg>
                </button>
            </div>
            <h2 class="mt-5 text-2xl font-bold text-white tracking-tight">User Palopo</h2>
            <p class="text-white/90 text-sm font-medium">Warga Kota Idaman</p>
            <div class="mt-3 bg-white/20 px-4 py-1 rounded-full backdrop-blur-sm">
                <p class="text-white text-[10px] font-bold uppercase tracking-widest">Penerima Jasa</p>
            </div>
        </div>
    </header>

    <main class="mt-8 px-6 pb-28 max-w-md mx-auto">
        <section class="space-y-4">
            <h3 class="text-xs font-bold text-gray-400 ml-2 uppercase tracking-widest mb-2">Pengaturan Akun</h3>
            
            <a href="edit-profil.html" class="flex items-center justify-between bg-white p-5 rounded-2xl border border-gray-100 shadow-sm active:scale-95 transition-all">
                <div class="flex items-center gap-4">
                    <div class="w-11 h-11 bg-blue-50 text-blue-500 rounded-2xl flex items-center justify-center">
                        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" stroke-width="2"></path></svg>
                    </div>
                    <span class="text-sm font-semibold text-gray-700">Informasi Pribadi</span>
                </div>
                <svg class="w-5 h-5 text-gray-300" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M9 5l7 7-7 7" stroke-width="2"></path></svg>
            </a>

            <a href="dashboard-freelancer.html" class="flex items-center justify-between bg-white p-5 rounded-2xl border border-gray-100 shadow-sm active:scale-95 transition-all">
                <div class="flex items-center gap-4">
                    <div class="w-11 h-11 bg-orange-50 text-orange-500 rounded-2xl flex items-center justify-center">
                        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M21 13.255A23.931 23.931 0 0112 15c-3.183 0-6.22-.62-9-1.745M16 6V4a2 2 0 00-2-2h-4a2 2 0 00-2 2v2m4 6h.01M5 20h14a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z" stroke-width="2"></path></svg>
                    </div>
                    <span class="text-sm font-semibold text-gray-700">Dashboard Freelancer</span>
                </div>
                <svg class="w-5 h-5 text-gray-300" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M9 5l7 7-7 7" stroke-width="2"></path></svg>
            </a>

            <a href="panduan-keamanan.html" class="flex items-center justify-between bg-white p-5 rounded-2xl border border-gray-100 shadow-sm active:scale-95 transition-all">
                <div class="flex items-center gap-4">
                    <div class="w-11 h-11 bg-green-50 text-green-500 rounded-2xl flex items-center justify-center">
                        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z" stroke-width="2"></path></svg>
                    </div>
                    <span class="text-sm font-semibold text-gray-700">Pusat Bantuan</span>
                </div>
                <svg class="w-5 h-5 text-gray-300" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M9 5l7 7-7 7" stroke-width="2"></path></svg>
            </a>

            <button class="w-full flex items-center justify-between bg-white p-5 rounded-2xl border border-gray-100 shadow-sm active:scale-95 transition-all">
                <div class="flex items-center gap-4 text-red-400">
                    <div class="w-11 h-11 bg-red-50 rounded-2xl flex items-center justify-center">
                        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1" stroke-width="2"></path></svg>
                    </div>
                    <span class="text-sm font-semibold">Keluar</span>
                </div>
            </button>
        </section>
    </main>

    <nav class="bg-white border-t border-gray-100 py-3 px-8 flex justify-between items-center fixed bottom-0 left-0 w-full z-20">
        <a href="index.html" class="flex flex-col items-center text-gray-400">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6" stroke-width="2"></path></svg>
            <span class="text-[10px] font-medium mt-1">Beranda</span>
        </a>
        <a href="tugas.html" class="flex flex-col items-center text-gray-400">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2" stroke-width="2"></path></svg>
            <span class="text-[10px] font-medium mt-1">Tugas</span>
        </a>
        <a href="daftar-freelancer.html" class="flex flex-col items-center text-gray-400">
            <div class="w-12 h-12 bg-pink-500 rounded-full flex items-center justify-center text-white shadow-lg -mt-8 border-4 border-white">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M12 4v16m8-8H4" stroke-width="2.5"></path></svg>
            </div>
            <span class="text-[10px] font-medium mt-1">Daftar</span>
        </a>
        <a href="pesan.html" class="flex flex-col items-center text-gray-400">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M8 10h.01M12 10h.01M16 10h.01M9 16H5a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v8a2 2 0 01-2 2h-5l-5 5v-5z" stroke-width="2"></path></svg>
            <span class="text-[10px] font-medium mt-1">Pesan</span>
        </a>
        <a href="profil.html" class="flex flex-col items-center text-pink-500">
            <svg class="w-6 h-6" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M10 9a3 3 0 100-6 3 3 0 000 6zm-7 9a7 7 0 1114 0H3z" clip-rule="evenodd"></path></svg>
            <span class="text-[10px] font-bold mt-1">Profil</span>
        </a>
    </nav>

</body>
</html>
