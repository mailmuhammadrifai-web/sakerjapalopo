    <style>
        body { font-family: 'Inter', sans-serif; }
        
        /* Warna Soft/Pastel Custom */
        .bg-soft-red { background-color: #FFF0F0; color: #FF6B6B; }
        .bg-soft-blue { background-color: #EBF8FF; color: #4299E1; }
        .bg-soft-orange { background-color: #FFF5F0; color: #ED8936; }

        .bg-soft-green { background-color: #F0FFF4; color: #48BB78; }

            background: linear-gradient(135deg, #fdfcfb 0%, #e2d1c3 100%);

        /* Banner Soft Pink-Peach */
